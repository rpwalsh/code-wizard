name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The execution layer does genuinely different things per platform —
        # process-tree termination and the environment allowlist among them —
        # so it is tested on all three rather than only on Linux.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python test tooling
        run: python -m pip install --disable-pip-version-check pytest ruff

      - run: npm ci

      - name: Check generated Python sources are in sync
        run: npm run generate:check

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

      - name: Verify the Python toolchain is usable
        run: node packages/cli/dist/main.js runtime doctor

      - name: Test
        run: npm test

      # The content gate. Runs separately from the unit tests so a broken
      # exercise is reported as a curriculum failure, not a code failure.
      - name: Validate every exercise
        run: node packages/cli/dist/main.js exercise validate

      - name: Check curriculum health
        run: node packages/cli/dist/main.js curriculum check
