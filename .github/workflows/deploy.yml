name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; never cancel one in flight, or Pages can be left
# serving a half-published build.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run build

      # The curriculum has to be bundled before the site is built, and this
      # step refuses to emit while any exercise is broken — so a bad exercise
      # fails the deploy rather than shipping a hole in the catalog.
      - name: Bundle the curriculum
        run: node packages/cli/dist/main.js content bundle

      - name: Build the site
        run: npm run build --workspace @code-wizard/web

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
