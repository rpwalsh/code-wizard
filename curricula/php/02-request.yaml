# Stage 2 — The request, and everything that arrives with it (lessons 15–26)
#
# Every input is hostile until proven otherwise, and this stage treats it that
# way. Each security lesson starts with the vulnerable version, exploited, and
# ends with the fix — because a rule you have never seen violated is a rule you
# will not apply under pressure.

stage: request
title: The request, and everything that arrives with it
lessons:
  - id: ph.015
    title: Shared nothing
    focus: What survives a request, and what does not.
    skills: [php.request.lifecycle]
    difficulty: 3

  - id: ph.016
    title: Input
    focus: Where it comes from, and why none of it is a type.
    skills: [php.request.input]
    difficulty: 3

  - id: ph.017
    title: Validating at the door
    focus: One place, failing loudly, before anything else runs.
    skills: [php.request.input]
    difficulty: 4

  - id: ph.018
    title: Talking to a database
    focus: Connections, prepared statements, and fetching into types.
    skills: [php.data.pdo]
    difficulty: 3

  - id: ph.019
    title: The injection
    focus: Write the vulnerable query. Exploit it. Then use a prepared statement.
    skills: [php.data.injection]
    difficulty: 5

  - id: ph.020
    title: Escaping is not parameterising
    focus: Why the manual version keeps failing.
    skills: [php.data.injection]
    difficulty: 5

  - id: ph.021
    title: Output escaping
    focus: 'Context matters: HTML, attribute, URL, script.'
    skills: [php.request.output]
    difficulty: 5

  - id: ph.022
    title: The stored script
    focus: Persist unescaped input, watch it execute, then fix the boundary.
    skills: [php.request.output]
    difficulty: 5

  - id: ph.023
    title: Sessions
    focus: What is in the cookie, and what is on the server.
    skills: [php.request.sessions]
    difficulty: 4

  - id: ph.024
    title: The forged request
    focus: Why a session cookie alone is not authorisation.
    skills: [php.request.sessions]
    difficulty: 5

  - id: ph.025
    title: Transactions
    focus: All or nothing, and the rollback on the error path.
    skills: [php.data.transactions]
    difficulty: 4

  - id: ph.026
    title: An endpoint, end to end
    focus: Validate, query, transact, escape, log, respond.
    skills: [php.request.output, php.data.transactions]
    difficulty: 5
