# Stage 1 — Decisions, and their costs (lessons 1–18)
#
# Architecture taught as case work rather than as diagrams. Each lesson is a
# situation with a real trade-off, and the answer is never the pattern — it is
# the reasoning about which cost this particular team can afford.
#
# Half the lessons deliberately have no good option, because most real ones do
# not either, and choosing well among bad options is the actual skill.

stage: judgement
title: Decisions, and their costs
lessons:
  - id: ar.001
    title: Coupling and cohesion
    focus: Two designs, and naming precisely what is wrong with each.
    skills: [architecture.boundaries.coupling]
    difficulty: 3

  - id: ar.002
    title: Where to put a seam
    focus: The line that makes change cheap, and the one that makes it expensive.
    skills: [architecture.boundaries.seams]
    difficulty: 4

  - id: ar.003
    title: Which way it points
    focus: Inverting a dependency, and what that buys and costs.
    skills: [architecture.boundaries.dependencies]
    difficulty: 4

  - id: ar.004
    title: Modules and ownership
    focus: A boundary a team can actually hold.
    skills: [architecture.boundaries.modules]
    difficulty: 4

  - id: ar.005
    title: One source of truth
    focus: Two systems that both think they own the same fact.
    skills: [architecture.state.sources]
    difficulty: 4

  - id: ar.006
    title: Choosing a consistency model
    focus: What the business can tolerate, asked before what the database offers.
    skills: [architecture.state.consistency]
    difficulty: 5

  - id: ar.007
    title: Events as a record
    focus: Storing what happened rather than what is, and what that costs to query.
    skills: [architecture.state.events]
    difficulty: 5

  - id: ar.008
    title: Reading a trade-off honestly
    focus: Argue the side you disagree with, well enough to convince.
    skills: [architecture.tradeoffs.cost]
    difficulty: 5

  - id: ar.009
    title: Reversible or not
    focus: Sorting eight decisions, and spending your care on the right ones.
    skills: [architecture.tradeoffs.reversibility]
    difficulty: 4

  - id: ar.010
    title: The solution nobody needed
    focus: A design for a scale that never arrived. Cost it.
    skills: [architecture.tradeoffs.simplicity]
    difficulty: 4

  - id: ar.011
    title: Recording why
    focus: A decision record someone can disagree with in two years.
    skills: [architecture.tradeoffs.records]
    difficulty: 3

  - id: ar.012
    title: Finding the constraint
    focus: Where the system actually stops scaling, from evidence.
    skills: [architecture.scale.bottlenecks]
    difficulty: 4

  - id: ar.013
    title: Estimating before building
    focus: Numbers on the back of an envelope, and the design they rule out.
    skills: [architecture.scale.capacity]
    difficulty: 4

  - id: ar.014
    title: Splitting work
    focus: Partitioning, and the key that made one shard hot.
    skills: [architecture.scale.partitioning]
    difficulty: 5

  - id: ar.015
    title: Partial failure
    focus: One component down. What still works, and what should.
    skills: [architecture.scale.failure]
    difficulty: 5

  - id: ar.016
    title: Understanding what is there
    focus: Characterising behaviour you cannot read, before changing it.
    skills: [architecture.legacy.characterisation]
    difficulty: 4

  - id: ar.017
    title: Replacing something that is running
    focus: Strangling it, and the intermediate state you have to live in.
    skills: [architecture.legacy.strangler]
    difficulty: 5

  - id: ar.018
    title: Changing what you cannot test
    focus: Getting a test in place first, safely, in the smallest possible step.
    skills: [architecture.legacy.risk]
    difficulty: 5
