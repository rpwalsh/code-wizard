id: architecture
title: Architecture
summary: >-
  Design judgement, drilled rather than discussed. Every exercise is a decision with a cost on both sides, and the deliverable is the reasoning as much as the structure.
blockedBy: >-
  A way to judge a design. Every other curriculum here is graded by executing code against tests; this one cannot be, and grading it with a model would put the one thing this platform refuses at the centre of its hardest subject. Until there is an honest deterministic way to assess a design, this stays a plan.

