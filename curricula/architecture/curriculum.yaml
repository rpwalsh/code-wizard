id: architecture
title: Architecture
summary: >-
  Architecture as programming, not as diagrams. Every exercise is a codebase with a measurable defect — an import cycle, a second source of truth, an operation that is not safe to retry — and you fix it until the property holds. The tests assert the property, not the drawing.
blockedBy: >-
  Exercise fixtures: multi-module codebases large enough for a boundary to be a real boundary, in a language with a runtime already behind it. The grading is not the obstacle — an import cycle is a cycle, an operation is idempotent or it is not, a module either compiles without its neighbor or it does not, and every one of those is checkable by running code. What is missing is the content.

