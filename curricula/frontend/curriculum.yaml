id: frontend
title: Frontend
summary: >-
  The part of frontend work that is not a framework. Accessibility, the layout model, forms that behave, and performance measured in the browser rather than guessed at.
blockedBy: >-
  A runtime with a real browser: a DOM, a layout engine, an accessibility tree and a way to drive input. Assertions here are about what a screen reader announces and what the layout does at 320 pixels, neither of which a text harness can see.

skills:
