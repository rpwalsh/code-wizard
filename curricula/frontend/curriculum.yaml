    name: Semantic markup
    category: Markup
    prerequisites: []
    description: The element that already does what you were about to build.

  - id: frontend.markup.landmarks
    name: Document structure
    category: Markup
    prerequisites: [frontend.markup.semantics]

  - id: frontend.markup.forms
