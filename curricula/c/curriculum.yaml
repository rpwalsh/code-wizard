id: c
title: C
summary: >-
  For someone who wants to know what the machine is actually doing. About memory you manage yourself, and the discipline that makes that survivable.
blockedBy: >-
  A compiler toolchain inside the sandbox, and a report format that separates a program which would not compile from one that compiled and failed. Those are different answers about the learner and must not arrive as the same result. C additionally needs the sandbox to survive a segmentation fault and report it as a result rather than as a crashed harness.

