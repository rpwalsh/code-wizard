# Stage 1 — Thinking in sets (lessons 1–16)
#
# The stage that separates people who write loops in SQL from people who write
# SQL. Almost every awkward query is a row-at-a-time idea wearing set syntax,
# and almost every wrong result is NULL behaving exactly as specified.

stage: sets
title: Thinking in sets
lessons:
  - id: sq.001
    title: Selecting and filtering
    focus: The shape of a query, and reading it in execution order.
    skills: [sql.query.select]
    difficulty: 1

  - id: sq.002
    title: Ordering and limiting
    focus: Top ten, and the tie that makes it non-deterministic.
    skills: [sql.query.ordering]
    difficulty: 2

  - id: sq.003
    title: NULL is not a value
    focus: Comparisons that are neither true nor false, and rows that vanish.
    skills: [sql.query.nulls]
    difficulty: 3

  - id: sq.004
    title: COALESCE and CASE
    focus: Deciding inside the query, and where that stops being readable.
    skills: [sql.query.expressions]
    difficulty: 2

  - id: sq.005
    title: Joining two tables
    focus: Matching rows, and what an inner join throws away.
    skills: [sql.sets.joins]
    difficulty: 3

  - id: sq.006
    title: The left join, and the NULL that means absent
    focus: Keeping the unmatched rows, and counting them correctly.
    skills: [sql.sets.joins, sql.query.nulls]
    difficulty: 4

  - id: sq.007
    title: The join that multiplied your rows
    focus: A one-to-many join under an aggregate. Watch the total triple.
    skills: [sql.sets.joins]
    difficulty: 4

  - id: sq.008
    title: Grouping
    focus: One row per group, and every column having to justify itself.
    skills: [sql.sets.aggregates]
    difficulty: 3

  - id: sq.009
    title: WHERE or HAVING
    focus: Filtering before or after grouping, and the different answers.
    skills: [sql.sets.having]
    difficulty: 3

  - id: sq.010
    title: Counting things that are not there
    focus: COUNT(*) against COUNT(column), and why they differ.
    skills: [sql.sets.aggregates, sql.query.nulls]
    difficulty: 4

  - id: sq.011
    title: Subqueries
    focus: In the WHERE, in the FROM, and the correlated one that runs per row.
    skills: [sql.sets.subqueries]
    difficulty: 4

  - id: sq.012
    title: Common table expressions
    focus: Naming a step, and a query someone else can read.
    skills: [sql.sets.ctes]
    difficulty: 3

  - id: sq.013
    title: Recursive CTEs
    focus: Walking a hierarchy stored as parent pointers.
    skills: [sql.sets.ctes]
    difficulty: 5

  - id: sq.014
    title: Window functions
    focus: A running total that does not collapse the rows.
    skills: [sql.sets.window]
    difficulty: 4

  - id: sq.015
    title: Ranking within a group
    focus: The top three per category, without a subquery per category.
    skills: [sql.sets.window]
    difficulty: 5

  - id: sq.016
    title: A report, in one query
    focus: Join, group, rank, format. Everything in this stage.
    skills: [sql.sets.window, sql.sets.joins]
    difficulty: 5
