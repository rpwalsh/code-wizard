# Stage 2 — Generics, and types that compute (lessons 15–26)
#
# Generics stop being intimidating the moment you see them as functions from
# types to types, which is exactly what they are. The stage builds up to
# writing the standard utility types by hand, because that is the point at
# which the type system stops being a thing you look up.

stage: generics
title: Generics, and types that compute
lessons:
  - id: ts.015
    title: A function that works for any type
    focus: The first generic, and how inference fills it in.
    skills: [typescript.generics.functions]
    difficulty: 3

  - id: ts.016
    title: Constraints
    focus: Any type that has a length, any type with these keys.
    skills: [typescript.generics.constraints]
    difficulty: 4

  - id: ts.017
    title: keyof, and typed property access
    focus: A getter that cannot ask for a property that does not exist.
    skills: [typescript.generics.constraints]
    difficulty: 4

  - id: ts.018
    title: Where inference gives up
    focus: The three places you must say it, and how to tell before the error.
    skills: [typescript.generics.inference]
    difficulty: 5

  - id: ts.019
    title: Partial, Pick, Omit
    focus: Use them, then write each one yourself in a line.
    skills: [typescript.types.utility]
    difficulty: 4

  - id: ts.020
    title: Record, and index signatures
    focus: A dictionary type, and why every lookup might be undefined.
    skills: [typescript.types.utility]
    difficulty: 4

  - id: ts.021
    title: Mapped types
    focus: Transforming every property of a type at once.
    skills: [typescript.types.mapped]
    difficulty: 5

  - id: ts.022
    title: Key remapping
    focus: Deriving getter names from property names, and where to stop.
    skills: [typescript.types.mapped]
    difficulty: 5

  - id: ts.023
    title: Conditional types
    focus: A type that branches, and infer.
    skills: [typescript.types.conditional]
    difficulty: 5

  - id: ts.024
    title: never, and what it means
    focus: The type with no values, and the three places it shows up on purpose.
    skills: [typescript.boundaries.unknown]
    difficulty: 5

  - id: ts.025
    title: Reading a library's types
    focus: Declaration files, and answering a question from the types rather than the docs.
    skills: [typescript.config.declaration]
    difficulty: 4

  - id: ts.026
    title: Typing something you did not write
    focus: Adding types to an untyped module, honestly.
    skills: [typescript.config.declaration, typescript.boundaries.assertions]
    difficulty: 5
