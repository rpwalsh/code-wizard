id: aspnet
title: ASP.NET
summary: >-
  For someone building services on .NET who wants the pipeline rather than the scaffolding. About middleware, model binding, and the parts of a request that fail under load.
blockedBy: >-
  Everything the C# curriculum needs, plus a host that can serve a request and be driven by a test client. It is the deepest of the planned stack and should not start before C# is runnable.

