id: cpp
title: C++
summary: >-
  For someone who writes C with classes and keeps meeting the parts that were added since. Built entirely around lifetime: what owns what, and what happens when it goes away.
blockedBy: >-
  A compiler toolchain inside the sandbox, and a report format that separates a program which would not compile from one that compiled and failed. Those are different answers about the learner and must not arrive as the same result. C++ also needs a compiler recent enough for the standard the course assumes, which is a version question the exercise format currently has no way to express.

skills:
  - id: cpp.lifetime.raii
    name: RAII
    category: Lifetime
    prerequisites: []
    description: Acquisition is initialisation, and destruction is the cleanup you never write.

  - id: cpp.lifetime.rule
    name: Copy, move, and the rule of zero
    category: Lifetime
    prerequisites: [cpp.lifetime.raii]

  - id: cpp.lifetime.unique
    name: unique_ptr
    category: Lifetime
    prerequisites: [cpp.lifetime.raii]

  - id: cpp.lifetime.shared
    name: shared_ptr, and the cycle
    category: Lifetime
    prerequisites: [cpp.lifetime.unique]

  - id: cpp.lifetime.references
    name: References, and dangling ones
    category: Lifetime
    prerequisites: [cpp.lifetime.raii]

  - id: cpp.values.move
    name: Move semantics
    category: Values
    prerequisites: [cpp.lifetime.rule]

  - id: cpp.values.const
    name: const, and what it promises
    category: Values
    prerequisites: [cpp.lifetime.references]

  - id: cpp.values.auto
    name: auto, and when it hides something
    category: Values
    prerequisites: [cpp.values.const]

  - id: cpp.std.containers
    name: The containers
    category: Standard library
    prerequisites: [cpp.lifetime.raii]

  - id: cpp.std.algorithms
    name: The algorithms
    category: Standard library
    prerequisites: [cpp.std.containers]
    description: The loop you did not write, and the name that says what it does.

  - id: cpp.std.strings
    name: Strings and string views
    category: Standard library
    prerequisites: [cpp.std.containers]

  - id: cpp.std.optional
    name: optional, variant, expected
    category: Standard library
    prerequisites: [cpp.std.containers]

  - id: cpp.types.classes
    name: Classes and invariants
    category: Types
    prerequisites: [cpp.lifetime.rule]

  - id: cpp.types.polymorphism
    name: Virtual functions
    category: Types
    prerequisites: [cpp.types.classes]

  - id: cpp.types.templates
    name: Templates
    category: Types
    prerequisites: [cpp.types.classes]

  - id: cpp.types.concepts
    name: Constraining a template
    category: Types
    prerequisites: [cpp.types.templates]

  - id: cpp.errors.exceptions
    name: Exceptions, and exception safety
    category: Errors
    prerequisites: [cpp.lifetime.raii]

  - id: cpp.errors.guarantees
    name: The three guarantees
    category: Errors
    prerequisites: [cpp.errors.exceptions]
