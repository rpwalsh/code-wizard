# Stage 2 — Concurrency you can reason about (lessons 17–28)
#
# The reason most people come to this language. Every lesson ends with the
# race detector run, because concurrency reasoned about and not measured is
# how the bug reaches production.

stage: concurrency
title: Concurrency you can reason about
lessons:
  - id: go.017
    title: A goroutine
    focus: Starting one, and the program that exited before it ran.
    skills: [go.concurrency.goroutines]
    difficulty: 3

  - id: go.018
    title: Waiting
    focus: WaitGroup, and the Add that happened too late.
    skills: [go.concurrency.goroutines]
    difficulty: 3

  - id: go.019
    title: A data race
    focus: Write it deliberately, then find it with the detector.
    skills: [go.concurrency.races]
    difficulty: 4

  - id: go.020
    title: Channels
    focus: Sending, receiving, and the block that is the whole design.
    skills: [go.concurrency.channels]
    difficulty: 3

  - id: go.021
    title: Buffered, and the deadlock
    focus: Capacity, and the send with nobody listening.
    skills: [go.concurrency.channels]
    difficulty: 4

  - id: go.022
    title: Closing
    focus: Who closes, and the receive that tells you it happened.
    skills: [go.concurrency.channels]
    difficulty: 4

  - id: go.023
    title: select
    focus: Waiting on several, and the default that busy-loops.
    skills: [go.concurrency.select]
    difficulty: 4

  - id: go.024
    title: Timeouts
    focus: A deadline in a select, and cleaning up the loser.
    skills: [go.concurrency.select]
    difficulty: 4

  - id: go.025
    title: Context
    focus: Cancellation that propagates, and the goroutine that ignored it.
    skills: [go.concurrency.context]
    difficulty: 5

  - id: go.026
    title: Fan-out, fan-in
    focus: Parallel work collected in order.
    skills: [go.concurrency.patterns]
    difficulty: 5

  - id: go.027
    title: Bounding the work
    focus: A worker pool, because unbounded goroutines is a different outage.
    skills: [go.concurrency.patterns]
    difficulty: 5

  - id: go.028
    title: A pipeline that shuts down cleanly
    focus: Every stage stopped, every channel closed, no leak.
    skills: [go.concurrency.context, go.concurrency.patterns]
    difficulty: 5
