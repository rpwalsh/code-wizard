# Stage 2 — Serving, and failing well (lessons 17–30)
#
# The half of Node that is on call. Everything here has a failure mode that
# only shows up with real traffic, so the exercises are built around the
# failure rather than the happy path.

stage: serving
title: Serving, and failing well
lessons:
  - id: nd.017
    title: An HTTP server, by hand
    focus: No framework. Request, response, and what a status code is for.
    skills: [node.net.http-server]
    difficulty: 3

  - id: nd.018
    title: Routing
    focus: Matching a path and a method without a table of ifs.
    skills: [node.net.routing]
    difficulty: 3

  - id: nd.019
    title: Middleware
    focus: A chain of functions, and one of them not calling the next.
    skills: [node.net.routing]
    difficulty: 4

  - id: nd.020
    title: Reading a body
    focus: Streams again, a size limit, and malformed input.
    skills: [node.net.http-server, node.io.streams]
    difficulty: 4

  - id: nd.021
    title: Validating a request
    focus: Rejecting at the door with a message the caller can act on.
    skills: [node.net.validation]
    difficulty: 4

  - id: nd.022
    title: Calling something else
    focus: A timeout, because a request with no deadline is an outage waiting.
    skills: [node.net.http-client]
    difficulty: 4

  - id: nd.023
    title: Retrying, carefully
    focus: Backoff, a cap, and which failures are safe to repeat.
    skills: [node.net.http-client]
    difficulty: 5

  - id: nd.024
    title: Canceling
    focus: The caller went away. Stop doing the work.
    skills: [node.net.http-client, node.failure.async]
    difficulty: 5

  - id: nd.025
    title: The error boundary
    focus: One place that turns any failure into a response, and logs the rest.
    skills: [node.failure.errors, node.net.routing]
    difficulty: 4

  - id: nd.026
    title: Shutting down
    focus: Stop accepting, finish what is in flight, then exit.
    skills: [node.failure.shutdown]
    difficulty: 5

  - id: nd.027
    title: Health, and readiness
    focus: Two different questions, and why answering one for both causes outages.
    skills: [node.failure.shutdown, node.operations.logging]
    difficulty: 4

  - id: nd.028
    title: Testing a server
    focus: Against a real socket, because a mocked one proves less than it seems.
    skills: [node.operations.testing]
    difficulty: 4

  - id: nd.029
    title: Under load
    focus: Concurrency limits, queueing, and where latency actually comes from.
    skills: [node.operations.performance, node.runtime.eventloop]
    difficulty: 5

  - id: nd.030
    title: A small service, end to end
    focus: Routes, validation, an outbound call with a timeout, structured logs, clean shutdown.
    skills: [node.net.routing, node.failure.shutdown, node.operations.logging]
    difficulty: 5
