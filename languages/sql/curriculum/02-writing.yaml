# Stage 2 — Writing, and making it fast (lessons 17–30)
#
# Performance is taught the same way complexity is taught in the Python
# course: by measurement. The learner reads a plan, changes one thing, and
# reads it again. Nobody is told what an index does before they have watched
# one stop being used.

stage: writing
title: Writing, and making it fast
lessons:
  - id: sq.017
    title: Keys and constraints
    focus: Letting the database refuse impossible data.
    skills: [sql.model.keys]
    difficulty: 3

  - id: sq.018
    title: Types, and what gets rejected
    focus: The column that accepted a string it should not have.
    skills: [sql.model.types]
    difficulty: 3

  - id: sq.019
    title: Normalization
    focus: Removing the duplicate, and the update anomaly it prevented.
    skills: [sql.model.normalization]
    difficulty: 4

  - id: sq.020
    title: When not to normalize
    focus: The join you do a million times a day.
    skills: [sql.model.normalization]
    difficulty: 5

  - id: sq.021
    title: Inserting
    focus: One row, many rows, and from a query.
    skills: [sql.change.insert]
    difficulty: 2

  - id: sq.022
    title: Updating carefully
    focus: The UPDATE without a WHERE, and how to never write it.
    skills: [sql.change.insert]
    difficulty: 3

  - id: sq.023
    title: Upserts
    focus: Insert or update, atomically, without a read first.
    skills: [sql.change.upsert]
    difficulty: 4

  - id: sq.024
    title: Transactions
    focus: All or nothing, and what a rollback undoes.
    skills: [sql.change.transactions]
    difficulty: 3

  - id: sq.025
    title: The lost update
    focus: Two sessions, one row. Watch it happen, then prevent it.
    skills: [sql.change.isolation]
    difficulty: 5

  - id: sq.026
    title: Isolation levels
    focus: What each one still allows, demonstrated rather than tabulated.
    skills: [sql.change.isolation]
    difficulty: 5

  - id: sq.027
    title: Reading a plan
    focus: Where the time went, from the database rather than a guess.
    skills: [sql.speed.plans]
    difficulty: 4

  - id: sq.028
    title: Adding an index
    focus: Measure, add, measure. And the write that got slower.
    skills: [sql.speed.indexes]
    difficulty: 4

  - id: sq.029
    title: The index that was not used
    focus: A function around the column, and the scan that followed.
    skills: [sql.speed.sargable]
    difficulty: 5

  - id: sq.030
    title: Composite indexes and order
    focus: Why the column order matters, shown with two plans.
    skills: [sql.speed.indexes, sql.speed.plans]
    difficulty: 5
