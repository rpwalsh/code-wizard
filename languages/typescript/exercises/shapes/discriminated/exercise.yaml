id: typescript.shapes.discriminated
version: 1
language: typescript
title: The compiler can count the cases for you
kind: micro-problem
difficulty: 3
estimatedSeconds: 600
timeoutMs: 20000

skills:
  - typescript.shapes.discriminated
  - typescript.shapes.exhaustive
  - typescript.basics.narrowing

prerequisites: []

learningObjectives:
  - Model a set of alternatives as a union with a shared literal tag.
  - Let a switch on that tag narrow each branch to one member.
  - Make adding a case a compile error everywhere it has been forgotten.

prompt: |
  A payment can be a card, a bank transfer, or store credit. Each
  carries different fields. The version of this that everybody
  writes first is one interface with every field optional, and it is
  wrong in a specific way: it describes a card payment with a bank
  account number and no card, which cannot exist, and it makes the
  compiler unable to help with any of it.

  In `main.ts`:

  - Export a type `Payment` — a union of three members, each tagged
    with a `method` property:
      - `{ method: 'card'; last4: string; amountCents: number }`
      - `{ method: 'transfer'; reference: string; amountCents: number }`
      - `{ method: 'credit'; amountCents: number }`

  - `describe(payment: Payment): string` — switch on `method`:
      - card → `"card ending 4242"`
      - transfer → `"transfer ref ABC-1"`
      - credit → `"store credit"`
    Inside each branch the other members' fields must not be
    reachable, and you should not need a cast to read the ones that
    are.

  - `feeCents(payment: Payment): number` — card is 2% rounded up,
    transfer is a flat 30, credit is 0.

  - `assertNever(value: never): never` — throw
    `` `unhandled: ${JSON.stringify(value)}` ``. Call it from the
    default branch of both switches. This is the piece that makes a
    fourth payment method a compile error in every switch that
    forgot it, rather than a silent wrong answer at runtime.

  - `totalCents(payments: Payment[]): number` — the sum of every
    amount plus every fee.

entryPoint: main.ts

tests:
  - path: tests/discriminated.test.ts
    visibility: visible
    concept: typescript.shapes.discriminated
  - path: tests/edges.test.ts
    visibility: edge
    concept: typescript.shapes.exhaustive

hints:
  - level: conceptual
    text: "A discriminated union says which combinations exist. One interface with optional fields says every combination exists, including the impossible ones."
  - level: structural
    text: "The tag must be a literal type, not `string`. `method: string` narrows nothing, because any string could be any member."
  - level: language
    text: "In the default branch of an exhaustive switch, the value's type is `never` — there is nothing left it could be. That is why assertNever's parameter type is what catches the missing case."
  - level: syntax
    text: "Math.ceil(amountCents * 0.02) for the card fee: a fee of 1.4 cents is charged as 2, and rounding down would mean charging nothing on small amounts."
  - level: explicit
    text: "export type Payment = { method: 'card'; last4: string; amountCents: number } | { method: 'transfer'; reference: string; amountCents: number } | { method: 'credit'; amountCents: number };"

explanation: |
  The optional-fields version fails at the one job a type has. It
  cannot say that a card payment has `last4` and a transfer does
  not, so every read becomes `payment.last4!` or a check the
  compiler cannot verify, and the impossible states — a card with a
  bank reference, a transfer with no reference at all — are as
  representable as the real ones. A discriminated union makes those
  states unspeakable, which is a stronger guarantee than any amount
  of testing.

  Narrowing is what makes it comfortable to use. Switching on a
  literal tag tells the compiler exactly which member it is holding
  in each branch, so `payment.last4` is a string with no assertion,
  no optional chaining and no doubt. This is the same machinery
  behind `typeof x === 'string'`; the tag is simply a discriminator
  you chose rather than one the language provided.

  `assertNever` is the part worth carrying to other code. In a
  branch that should be unreachable, the value's type is `never`,
  and `never` is assignable to nothing — so the call compiles only
  while the switch really is exhaustive. Add a fourth payment method
  and every switch that forgot it fails to compile, naming the file
  and the line. Without it, the same omission is a runtime surprise
  that reaches production, because the code still runs; it just
  returns undefined and charges nobody.

  The fee rounding is a small deliberate trap. `Math.round` on a
  1.4-cent fee charges 1, and `Math.floor` charges 0 — meaning every
  payment under fifty cents is processed free. Fees round up, and
  the edge tests say so.
