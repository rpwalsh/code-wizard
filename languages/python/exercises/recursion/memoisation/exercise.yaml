id: python.recursion.memoisation
version: 1
language: python
title: The same question, asked a hundred and seventy-seven times
kind: micro-problem
difficulty: 4
estimatedSeconds: 360
timeoutMs: 15000

skills:
  - python.recursion.memoisation

prerequisites:
  - python.recursion.tree
  - python.collections.dict-mutation

learningObjectives:
  - Measure how many times a branching recursion repeats the same call.
  - Add a cache by hand and watch the count collapse.
  - Recognise when a cache is safe, and when the key is wrong.

prompt: |
  Branching recursion recomputes. `fib(5)` asks for `fib(3)` twice, and each of
  those asks for `fib(1)` again, and it goes on.

  - `fib_naive(n)` returns the nth Fibonacci number, recursively, with no cache.
    `fib_naive(0)` is 0 and `fib_naive(1)` is 1.
  - `fib_calls(n)` returns **how many calls** `fib_naive(n)` would make in
    total, counting the outermost one.
  - `fib_fast(n)` returns the same number using a dictionary cache you write
    yourself. It must answer `fib_fast(60)` instantly.
  - `cached_calls(n)` returns how many calls the cached version makes.

  Run `fib_calls(10)` before you write anything else. The number is the point
  of the exercise.

entryPoint: main.py

tests:
  - path: tests/test_memoisation.py
    visibility: visible
    concept: python.recursion.memoisation
  - path: tests/test_cost.py
    visibility: edge
    concept: python.recursion.memoisation
  - path: tests/test_hidden.py
    visibility: hidden
    concept: python.recursion.memoisation

hints:
  - level: conceptual
    text: The naive version asks the same question many times and gets the same answer every time.
  - level: structural
    text: A dictionary from argument to answer, checked on the way in and filled on the way out.
  - level: language
    text: 'A cache passed as a default argument persists between calls, which is usually a bug and here is not what you want either.'
  - level: syntax
    text: 'Build the cache inside a wrapper and pass it down explicitly.'
  - level: explicit
    text: '`if n in cache: return cache[n]`, compute, `cache[n] = result`, return it.'

explanation: |
  `fib_naive(30)` makes over two and a half million calls to compute a number
  you could work out on paper. Nothing about the code looks expensive — it is
  three lines — and that is exactly why counting matters more than reading.

  The cached version makes one call per distinct argument, so the count goes
  from exponential to linear and `fib(60)` becomes instant. The mechanism is
  three lines and the effect is the difference between a program that finishes
  and one that does not.

  Where caching goes wrong is the key. It is safe here because the answer
  depends only on `n` and never changes. Cache something whose answer depends
  on anything else — the time, a file, a mutable argument — and you have built
  a bug that only appears the second time.
