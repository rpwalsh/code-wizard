# Stage 2 — Data, and where the time goes (lessons 17–26)
#
# Every lesson here ends with the generated SQL on screen. An ORM that you
# cannot see through is an ORM that will surprise you in production, and the
# surprise is always the same one: it ran in memory.

stage: data
title: Data, and where the time goes
lessons:
  - id: as.017
    title: A context, scoped correctly
    focus: One per request, and what happens when it is not.
    skills: [aspnet.data.context]
    difficulty: 4

  - id: as.018
    title: Read the generated SQL
    focus: Every query, printed, before believing anything about it.
    skills: [aspnet.data.queries]
    difficulty: 4

  - id: as.019
    title: The query that ran in memory
    focus: One method the provider cannot translate, and the whole table loaded.
    skills: [aspnet.data.queries]
    difficulty: 5

  - id: as.020
    title: The N+1
    focus: Count the queries. Then load related data in one.
    skills: [aspnet.data.queries]
    difficulty: 5

  - id: as.021
    title: Tracking, and turning it off
    focus: What the context is remembering, and what that costs on a read.
    skills: [aspnet.data.tracking]
    difficulty: 4

  - id: as.022
    title: Projecting to exactly what you need
    focus: Selecting three columns instead of an entity graph.
    skills: [aspnet.data.queries]
    difficulty: 4

  - id: as.023
    title: Saving, and the transaction
    focus: One unit of work, and the rollback on failure.
    skills: [aspnet.data.context]
    difficulty: 4

  - id: as.024
    title: Concurrency
    focus: Two writers, one row, and the update that vanished.
    skills: [aspnet.data.tracking]
    difficulty: 5

  - id: as.025
    title: Schema changes
    focus: A migration that can be applied to a live database.
    skills: [aspnet.data.migrations]
    difficulty: 5

  - id: as.026
    title: An endpoint, end to end
    focus: Bind, validate, authorize, query, transact, log, respond.
    skills: [aspnet.pipeline.validation, aspnet.data.context, aspnet.security.authz]
    difficulty: 5
