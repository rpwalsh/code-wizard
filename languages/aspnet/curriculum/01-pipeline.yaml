# Stage 1 — The pipeline, and what it does to a request (lessons 1–16)
#
# A request is a value passing through an ordered list of functions, and
# almost every framework surprise is that ordering. The stage builds the
# pipeline by hand before naming any of it.

stage: pipeline
title: The pipeline, and what it does to a request
lessons:
  - id: as.001
    title: Middleware, by hand
    focus: A list of functions, each calling the next.
    skills: [aspnet.pipeline.middleware]
    difficulty: 3

  - id: as.002
    title: The one that did not call next
    focus: Ordering, short-circuiting, and the header set too late.
    skills: [aspnet.pipeline.middleware]
    difficulty: 4

  - id: as.003
    title: Routing
    focus: Matching, parameters, and constraints.
    skills: [aspnet.pipeline.routing]
    difficulty: 3

  - id: as.004
    title: Model binding
    focus: Where each value came from, and the one that bound silently to nothing.
    skills: [aspnet.pipeline.binding]
    difficulty: 4

  - id: as.005
    title: Validation
    focus: Rejecting at the door, with a body the caller can act on.
    skills: [aspnet.pipeline.validation]
    difficulty: 4

  - id: as.006
    title: Status codes that mean something
    focus: The four that matter, and the difference between two of them.
    skills: [aspnet.pipeline.results]
    difficulty: 3

  - id: as.007
    title: Service lifetimes
    focus: Three of them, and choosing by what the service holds.
    skills: [aspnet.di.lifetimes]
    difficulty: 4

  - id: as.008
    title: The captive dependency
    focus: A scoped service inside a singleton. Watch it go stale.
    skills: [aspnet.di.lifetimes]
    difficulty: 5

  - id: as.009
    title: Configuration
    focus: Bound to a type, validated at startup, failing loudly.
    skills: [aspnet.di.options]
    difficulty: 3

  - id: as.010
    title: One error boundary
    focus: Every failure becoming a response, and the details going to the log.
    skills: [aspnet.operations.errors]
    difficulty: 4

  - id: as.011
    title: Structured logging
    focus: Fields rather than sentences, and a correlation id that survives.
    skills: [aspnet.operations.logging]
    difficulty: 4

  - id: as.012
    title: Authentication
    focus: Who the caller is, established once.
    skills: [aspnet.security.authn]
    difficulty: 4

  - id: as.013
    title: Authorization
    focus: What they may do, decided close to the data.
    skills: [aspnet.security.authz]
    difficulty: 5

  - id: as.014
    title: CORS, and the header you got wrong
    focus: Reproduce the browser refusal, then fix it properly.
    skills: [aspnet.security.headers]
    difficulty: 4

  - id: as.015
    title: Health and readiness
    focus: Two questions, and the outage caused by answering one for both.
    skills: [aspnet.operations.health]
    difficulty: 4

  - id: as.016
    title: Testing against a real host
    focus: A test client, a real pipeline, and no mocked framework.
    skills: [aspnet.operations.testing]
    difficulty: 4
