# # Stage 1 — Components, injection and change (lessons 1–14)
#
# Angular is three ideas — a component tree, an injector, and change
# detection — and almost every confusion is one of the three behaving exactly
# as designed in a place you had not thought about it.

stage: components
title: Components, injection and change
lessons:
  - id: ng.001
    title: A component
    focus: Template, class, and the decorator that connects them.
    skills: [angular.components.template]
    difficulty: 2

  - id: ng.002
    title: Binding
    focus: Property, event, and the two-way form that is neither.
    skills: [angular.components.binding]
    difficulty: 3

  - id: ng.003
    title: Inputs and outputs
    focus: A component's interface, and keeping it small.
    skills: [angular.components.inputs]
    difficulty: 3

  - id: ng.004
    title: Lifecycle
    focus: Which hook, and the far shorter list you actually need.
    skills: [angular.components.lifecycle]
    difficulty: 3

  - id: ng.005
    title: Content projection
    focus: Slots, and a component that does not know its children.
    skills: [angular.components.content]
    difficulty: 4

  - id: ng.006
    title: What injection is for
    focus: Build it by hand first. Then use the framework and see what it removed.
    skills: [angular.di.providers]
    difficulty: 3

  - id: ng.007
    title: Where a service lives
    focus: Root or component, and the state that turned out to be shared.
    skills: [angular.di.scope]
    difficulty: 4

  - id: ng.008
    title: Tokens
    focus: Injecting something that is not a class.
    skills: [angular.di.tokens]
    difficulty: 4

  - id: ng.009
    title: When does it re-render
    focus: Count the runs. The number surprises everyone once.
    skills: [angular.change.detection]
    difficulty: 4

  - id: ng.010
    title: OnPush
    focus: The contract you are signing, and what breaks when you break it.
    skills: [angular.change.onpush]
    difficulty: 5

  - id: ng.011
    title: Signals
    focus: State that knows who is reading it.
    skills: [angular.change.signals]
    difficulty: 4

  - id: ng.012
    title: Routing
    focus: Paths, parameters, and the component that did not reload.
    skills: [angular.routing.routes]
    difficulty: 3

  - id: ng.013
    title: Guards
    focus: Refusing a route, and doing it without a race.
    skills: [angular.routing.guards]
    difficulty: 4

  - id: ng.014
    title: Testing a component
    focus: Rendering it for real, with its dependencies replaced honestly.
    skills: [angular.testing.harness]
    difficulty: 4
