id: cpp.types.enums
version: 1
language: cpp
title: A switch with no default
kind: micro-problem
difficulty: 2
estimatedSeconds: 600
timeoutMs: 30000

skills:
  - cpp.types.enums
  - cpp.std.containers

prerequisites: []

learningObjectives:
  - Use a scoped enumeration so the names stay put and nothing turns into an int by accident.
  - Leave the default case off a switch and let the compiler check it for you.
  - Cast to the underlying type in one place, on purpose, rather than everywhere.

prompt: |
  `Level` is an `enum class`, so `Level::error` does not quietly
  become `3` and `error` on its own does not name anything. Both of
  those are improvements on the older kind of `enum`, and both
  change how the code around it has to be written.

  In `main.cpp`:

  - `name(level)` — `"debug"`, `"info"`, `"warning"`, `"error"`,
    `"fatal"`.
  - `parse_level(text)` — the level with exactly that name, or
    nothing. Exact: no prefixes, no other capitalization, no
    surrounding spaces.
  - `severity(level)` — how far up the scale it sits, with `debug`
    at zero.
  - `at_least(level, threshold)` — whether the level is **at or
    above** the threshold.
  - `at_or_above(lines, threshold)` — the text of the lines that
    qualify, in order.
  - `worst(levels)` — the most serious present. Nothing at all is
    `debug`.

  Write `name` as a `switch` with no `default:` case, and read what
  the compiler tells you if you leave one out.

entryPoint: main.cpp

tests:
  - path: tests/enums_test.cpp
    visibility: visible
    concept: cpp.types.enums
  - path: tests/edges_test.cpp
    visibility: edge
    concept: cpp.types.enums

hints:
  - level: conceptual
    text: "The enumerators are declared in order of severity, so the ordering you need is already there. Comparing two Levels needs no conversion."
  - level: structural
    text: "parse_level can walk the list of levels and compare each one's name. Then the names are written once and the two functions cannot disagree."
  - level: language
    text: "A scoped enum does not convert to int on its own. static_cast<int>(level) is how you ask, and needing to ask is the feature."
  - level: syntax
    text: "at_least is level >= threshold. That comparison is defined for scoped enums and means declaration order."
  - level: explicit
    text: "worst starts at Level::debug, the lowest there is, and keeps whichever level it meets that is higher. Starting anywhere else makes an empty list return something that never happened."

explanation: |
  A scoped enum fixes two specific things about the older kind. The
  enumerators stay inside `Level`, so a name like `error` does not
  collide with every other `error` in the program. And they do not
  convert to `int` on their own, so a `Level` cannot be passed to a
  function expecting a count, added to a number, or compared against
  `3` by accident. Both of those were real sources of bugs, and both
  are fixed by two extra characters in the declaration.

  Leaving `default:` off the switch is the trick worth taking away.
  With every enumerator handled and no default, adding a sixth level
  makes the compiler point at this function — every switch over the
  type becomes a checklist that maintains itself. Add `default:
  return "unknown";` and the same change compiles silently and
  starts logging `unknown` in production. The `return ""` after the
  switch is there only because a function must return on every path
  the compiler can imagine; it is unreachable, and the switch above
  it is the real code.

  Writing `parse_level` in terms of `name` is the same instinct
  applied to data. Two functions with two hard-coded lists of five
  strings will eventually disagree, usually right after somebody
  fixes a spelling in one of them. One list, used both directions,
  cannot.

  `static_cast<int>` in exactly one function is the point of the
  cast being required. The numbering is a real thing you sometimes
  need — for an index, a wire format, a sort key — and having to ask
  for it means every place that depends on it is greppable. Compare
  that with an unscoped enum, where the conversion happens silently
  anywhere and the dependency on the numbering is invisible until
  somebody inserts a new value in the middle.

  `worst` starting at the lowest possible level is what makes the
  empty case honest. Any other starting value is a claim that
  something happened, and an empty log reporting `error` is worse
  than useless — it is a false alarm generated by the summarizer.
