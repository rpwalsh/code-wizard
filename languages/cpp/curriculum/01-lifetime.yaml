# Stage 1 — Lifetime, and what owns what (lessons 1–16)
#
# Every C++ difficulty is a lifetime question in disguise. Teaching RAII
# first, before any syntax, turns most of the rest into consequences rather
# than rules to remember.

stage: lifetime
title: Lifetime, and what owns what
lessons:
  - id: cpp.001
    title: RAII
    focus: A destructor doing the cleanup you would have forgotten.
    skills: [cpp.lifetime.raii]
    difficulty: 3

  - id: cpp.002
    title: The rule of zero
    focus: Own nothing directly, and write none of the five.
    skills: [cpp.lifetime.rule]
    difficulty: 4

  - id: cpp.003
    title: unique_ptr
    focus: Ownership in the type, and the move that transfers it.
    skills: [cpp.lifetime.unique]
    difficulty: 4

  - id: cpp.004
    title: shared_ptr, and its cost
    focus: Reference counting, and the cycle that never frees.
    skills: [cpp.lifetime.shared]
    difficulty: 5

  - id: cpp.005
    title: A dangling reference
    focus: Bind to a temporary, watch it die, then fix the signature.
    skills: [cpp.lifetime.references]
    difficulty: 5

  - id: cpp.006
    title: Move semantics
    focus: What a moved-from object is, and what you may do with it.
    skills: [cpp.values.move]
    difficulty: 5

  - id: cpp.007
    title: const
    focus: On the value, on the pointer, on the method. Three different promises.
    skills: [cpp.values.const]
    difficulty: 4

  - id: cpp.008
    title: auto, and the copy it hid
    focus: The reference you did not take.
    skills: [cpp.values.auto]
    difficulty: 4

  - id: cpp.009
    title: Containers
    focus: vector first, and the far shorter list of times it is wrong.
    skills: [cpp.std.containers]
    difficulty: 3

  - id: cpp.010
    title: Algorithms
    focus: Replace five loops with five names.
    skills: [cpp.std.algorithms]
    difficulty: 4

  - id: cpp.011
    title: string_view
    focus: Not owning the text, and the dangling one that follows.
    skills: [cpp.std.strings]
    difficulty: 5

  - id: cpp.012
    title: optional and variant
    focus: Absence and alternatives in the type system.
    skills: [cpp.std.optional]
    difficulty: 4

  - id: cpp.013
    title: Classes and invariants
    focus: What must stay true, enforced by the constructor.
    skills: [cpp.types.classes]
    difficulty: 4

  - id: cpp.014
    title: Virtual, and the destructor you forgot
    focus: Deleting through a base pointer.
    skills: [cpp.types.polymorphism]
    difficulty: 5

  - id: cpp.015
    title: Templates
    focus: Compile-time generic code, and the error message.
    skills: [cpp.types.templates]
    difficulty: 5

  - id: cpp.016
    title: Exception safety
    focus: Basic, strong, nothrow — and which one your function offers.
    skills: [cpp.errors.guarantees]
    difficulty: 5
