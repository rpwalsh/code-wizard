id: rust.types.enums
version: 1
language: rust
title: States that cannot coexist, types that agree
kind: micro-problem
difficulty: 4
estimatedSeconds: 600
timeoutMs: 90000

skills:
  - rust.types.enums
  - rust.data.strings
  - rust.own.clone

prerequisites: []

learningObjectives:
  - Model mutually exclusive states as enum variants carrying their own data.
  - Match exhaustively, and let the compiler audit every new variant.
  - Work at the String/&str boundary without cloning by reflex.

prompt: |
  A download is queued, running, done or failed — and each state knows
  different things: only `Running` has progress, only `Failed` has a
  reason. In most languages that is four booleans and a prayer; in Rust
  it is an enum, and the illegal combinations do not compile.

  In `main.rs`:

  - `enum Transfer` — `Queued`, `Running { percent: u8 }`,
    `Done { bytes: u64 }`, `Failed { reason: String }`.
  - `describe(transfer: &Transfer) -> String` — `"queued"`,
    `"running (42%)"`, `"done (1024 bytes)"`, `"failed: REASON"`.
    A match with no `_` arm: adding a variant must break this build.
  - `advance(transfer: Transfer, step: u8) -> Transfer` — Queued
    becomes Running at 0 + step; Running adds step, *saturating* at
    100 and becoming `Done { bytes: 0 }` on reaching it; Done and
    Failed stay themselves (moves in, moves out — no clone needed).
  - `first_failure(transfers: &[Transfer]) -> Option<&str>` — the
    reason of the first Failed, as `&str` borrowed from the slice —
    not a fresh String. The signature is the exercise: `&str` out of
    `&[Transfer]` proves no allocation happened.
  - `tally(transfers: &[Transfer]) -> (usize, usize, usize, usize)` —
    (queued, running, done, failed) counts.

entryPoint: main.rs

tests:
  - path: tests/enums_test.rs
    visibility: visible
    concept: rust.types.enums
  - path: tests/edges_test.rs
    visibility: edge
    concept: rust.data.strings

hints:
  - level: conceptual
    text: Each variant is a struct that exists only inside the enum. Data that only one state has lives in that state, and nowhere else can even mention it.
  - level: structural
    text: describe and advance are one match each; tally is a fold over matches (or a loop with four counters).
  - level: language
    text: "u8::saturating_add is the arithmetic that stops at the top instead of wrapping — exactly the semantics a percentage wants."
  - level: syntax
    text: "first_failure: transfers.iter().find_map(|t| match t { Transfer::Failed { reason } => Some(reason.as_str()), _ => None })"
  - level: explicit
    text: "advance's Running arm: let next = percent.saturating_add(step); if next >= 100 { Transfer::Done { bytes: 0 } } else { Transfer::Running { percent: next } }"

explanation: |
  The four-booleans version of this type has sixteen states and four
  meanings; the enum has four states and four meanings. That is the
  entire argument for sum types, and Rust adds the enforcement: match
  without `_` is a contract that every variant is handled, so adding
  `Paused` tomorrow turns every relevant match into a compile error —
  a to-do list generated by the type checker, each item pointing at
  code that genuinely needs a decision.

  first_failure's signature is a small ownership proof. Returning
  `Option<&str>` borrowed from the input says, in the type, "I
  allocated nothing" — `reason.as_str()` reborrows the String living
  inside the slice, and the caller reads it for free. The reflexive
  `.clone()` that would have returned `Option<String>` compiles fine
  and costs an allocation per call; the borrow costs a lifetime tie
  the compiler checks for you. Learning which to reach for first is
  most of what "fighting the borrow checker" turns into once the
  fight is over.

  advance taking `Transfer` by value — not `&mut` — is the functional
  state-machine idiom: states move in, new states move out, and Done
  passing through unchanged is genuinely free (a move, not a copy).
  When a state type grows heavy fields, this style keeps working;
  `&mut self` machines and move machines are both idiomatic, but only
  one of them lets old states be kept for an undo history without
  cloning.

mutationExceptions:
  - path: main.rs
    operator: saturating
    line: 27
    why: >-
      The base is the literal 0, so 0.wrapping_add(step) and
      0.saturating_add(step) agree for every u8 step — no input can
      distinguish them here.
